name: Kripto Sinyal Botu

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install requests pandas pandas-ta

      - name: Botu Çalıştır ve Komutları Dinle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python botum.py 2>&1 | grep -v -E "Node.js|deprecated|forced to run|will be removed|For more information see" || true

      - name: Hafızayı GitHub Deposuna Geri Kaydet
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add takip_listesi.txt || true
          git commit -m "Takip listesi hafızası güncellendi [skip ci]" || true
          git push || true
