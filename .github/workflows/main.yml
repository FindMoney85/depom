name: Kripto Sinyal Botu

on:
  schedule:
    # Her 4 saatte bir otomatik çalıştır (UTC saatine göredir)
    - cron: '0 */4 * * *'
  workflow_dispatch: # İstediğiniz zaman elle de başlatabilmeniz için

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # GitHub sunucusuna tüm JavaScript aksiyonlarını Node 24 ile çalıştırmasını söylüyoruz
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install requests pandas pandas-ta

      - name: Botu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python botum.py
