name: Follow Line Bot Kılavuzu

on:
  schedule:
    # Her 4 saatte bir otomatik çalışır (Dakika Saat Gün Ay Gün_Haftası)
    # UTC saatine göredir. 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
    - cron: '0 */4 * * *'
  
  # GitHub paneli üzerinden "Run workflow" butonuyla elinle de tetikleyebilmen için:
  workflow_dispatch:

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest

    steps:
    # 1. Depondaki kodları ve "coinlerim.txt" dosyasını sunucuya çek
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    # 2. Sunucuya Python Kur
    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.10'

    # 3. Gerekli kütüphaneleri yükle
    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install ccxt pandas requests

    # 4. Botu çalıştır ve GitHub Secrets'tan tokenları güvenli bir şekilde bota aktar
    - name: Botu Çalıştır
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bot.py
