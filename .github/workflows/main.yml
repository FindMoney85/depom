name: Kripto Sinyal Botu

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Kütüphaneleri Yükle
        run: |
          pip install requests pandas pandas-ta

      - name: Botu Çalıştır ve Uyarıları Filtrele
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
        run: |
          python botum.py 2>&1 | grep -v -E "Node.js|deprecated|forced to run|will be removed|For more information see" || true
