name: Kripto Sinyal Botu

on:
  schedule:
    # Her 4 saatte bir otomatik çalıştır (UTC saatine göredir)
    - cron: '0 */4 * * *'
  workflow_dispatch: # İstediğiniz zaman elle de başlatabilmeniz için

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4  # v3 yerine en güncel v4 sürümüne yükseltildi (Node 24 uyumlu)

      - name: Python Kur
        uses: actions/setup-python@v5  # v4 yerine en güncel v5 sürümüne yükseltildi (Node 24 uyumlu)
        with:
          python-version: '3.10'  # Hatalı olan 'python-mode' kaldırıldı, doğrusu olan 'python-version' yazıldı

      - name: Kütüphaneleri Yükle
        run: |
          pip install requests pandas pandas-ta

      - name: Botu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python botum.py
